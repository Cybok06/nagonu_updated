<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>{{ purchase.checker_type|upper }} Checker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;background:linear-gradient(140deg,#071d45,#1767d8);display:grid;place-items:center;padding:18px;font-family:system-ui,sans-serif}.box{width:min(720px,100%);background:#fff;border-radius:24px;box-shadow:0 30px 80px #00143380;overflow:hidden}.head{padding:28px;background:#f1f7ff}.message{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fafc;border:1px solid #dce5f1;border-radius:15px;padding:20px;line-height:1.7}</style></head><body><main class="box"><div class="head"><span class="badge text-bg-success mb-2">Payment successful</span><h1 class="h3 fw-bold mb-0">{{ purchase.checker_type|upper }} Results Checker</h1></div><div class="p-4"><p class="text-muted">Your checker has been delivered. Keep this private page safe.</p><div class="message" id="msg">{{ purchase.message }}</div><div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-primary" id="copy">Copy message</button><a class="btn btn-outline-secondary" href="{{ url_for('purchase_checker.public_results_checker') }}">Buy another checker</a></div><small class="d-block text-muted mt-3">You can refresh or bookmark this page to view this checker again.</small></div></main><script>document.getElementById('copy').onclick=async function(){try{await navigator.clipboard.writeText(document.getElementById('msg').textContent||'');this.textContent='Copied'}catch(_){this.textContent='Select and copy manually'}}</script></body></html>

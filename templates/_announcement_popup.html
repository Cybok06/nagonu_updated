{% if announcement_popup %}
<style>
.nagonu-announcement .modal-dialog{max-width:580px}.nagonu-announcement .modal-content{overflow:hidden;border:0;border-radius:24px;box-shadow:0 30px 90px rgba(15,23,42,.28)}.nagonu-announcement .announcement-top{height:7px;background:linear-gradient(90deg,#1769e0,#7c3aed,#06b6d4)}.nagonu-announcement .modal-body{padding:28px}.nagonu-announcement .announcement-icon{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;background:#edf5ff;color:#1769e0;font-size:1.35rem}.nagonu-announcement .announcement-title{font-size:1.35rem;font-weight:800;letter-spacing:-.025em;color:#172033}.nagonu-announcement .announcement-date{color:#667085;font-size:.82rem}.nagonu-announcement .announcement-message{margin-top:20px;padding:18px;border:1px solid #e6eaf0;border-radius:16px;background:#f8fafc;color:#344054;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.nagonu-announcement .btn{border-radius:11px;font-weight:700;padding:.72rem 1.15rem}@media(max-width:575px){.nagonu-announcement .modal-dialog{margin:12px}.nagonu-announcement .modal-content{border-radius:20px}.nagonu-announcement .modal-body{padding:21px}.nagonu-announcement .announcement-title{font-size:1.18rem}.nagonu-announcement .btn{width:100%}}
</style>
<div class="modal fade nagonu-announcement" id="nagonuAnnouncementPopup" tabindex="-1" aria-hidden="true" data-id="{{ announcement_popup._id_str }}" data-location="{{ announcement_location }}" data-ack-url="{{ url_for('announcements.acknowledge_announcement',announcement_id=announcement_popup._id_str) }}" data-logged-in="{{ '1' if session.get('user_id') else '0' }}">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="announcement-top"></div><div class="modal-body"><div class="d-flex align-items-start gap-3"><div class="announcement-icon flex-shrink-0"><i class="bi bi-megaphone-fill"></i></div><div><div class="announcement-title">{{ announcement_popup.title }}</div><div class="announcement-date">{{ announcement_popup.created_at_fmt }}</div></div></div><div class="announcement-message">{{ announcement_popup.message }}</div><div class="d-flex justify-content-end mt-4"><button type="button" class="btn btn-primary" id="nagonuAnnouncementAck">I understand</button></div></div></div></div>
</div>
<script>
(function(){const el=document.getElementById('nagonuAnnouncementPopup');if(!el||!window.bootstrap)return;const id=el.dataset.id,location=el.dataset.location||'page',key='nagonu_announcement_ack_'+location+'_'+id;if(el.dataset.loggedIn!=='1'&&localStorage.getItem(key)==='1')return;const modal=bootstrap.Modal.getOrCreateInstance(el,{backdrop:'static',keyboard:false});const button=document.getElementById('nagonuAnnouncementAck');button.addEventListener('click',async function(){button.disabled=true;button.textContent='Saving...';let saved=true;if(el.dataset.loggedIn==='1'){try{const response=await fetch(el.dataset.ackUrl,{method:'POST',credentials:'same-origin',headers:{'Accept':'application/json'}});saved=response.ok}catch(_){saved=false}}else{try{localStorage.setItem(key,'1')}catch(_){}}if(saved){modal.hide()}else{button.disabled=false;button.textContent='I understand'}});modal.show()})();
</script>
{% endif %}

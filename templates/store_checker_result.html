<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>{{ purchase.checker_type|upper }} Result Checker - {{ store.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --brand: {{ (store.theme or {}).get('primary', '#0d6efd') }}; }
    body { min-height:100vh; background:#f4f7fb; color:#172033; }
    .result-shell { max-width:760px; margin:auto; }
    .result-card { border:0; border-radius:22px; box-shadow:0 18px 50px rgba(15,23,42,.12); overflow:hidden; }
    .result-head { background:var(--brand); color:#fff; padding:1.4rem 1.6rem; }
    .result-message { white-space:pre-wrap; overflow-wrap:anywhere; font:500 1rem/1.7 system-ui,sans-serif; background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; padding:1.25rem; }
  </style>
</head>
<body class="d-flex p-3 p-md-4">
  <main class="result-shell w-100">
    <div class="card result-card">
      <div class="result-head d-flex align-items-center gap-3">
        {% if store.logo_url %}<img src="{{ store.logo_url }}" alt="" width="48" height="48" class="rounded-circle bg-white object-fit-cover">{% endif %}
        <div><div class="small opacity-75">{{ store.name }}</div><h1 class="h4 mb-0">{{ purchase.checker_type|upper }} Results Checker</h1></div>
      </div>
      <div class="card-body p-4">
        <div class="alert alert-success">Payment successful. Your checker has been delivered.</div>
        <div class="result-message" id="checkerMessage">{{ purchase.message }}</div>
        <div class="d-flex flex-wrap gap-2 mt-4">
          <button class="btn btn-primary" type="button" id="copyChecker">Copy message</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('stores.store_public_page', slug=store.slug) }}">Return to store</a>
        </div>
        <p class="small text-muted mt-3 mb-0">Keep this private page or bookmark it. Refreshing will continue to show this purchase.</p>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('copyChecker').addEventListener('click', async function () {
      try {
        await navigator.clipboard.writeText(document.getElementById('checkerMessage').textContent || '');
        this.textContent = 'Copied';
      } catch (_) { this.textContent = 'Select and copy the message'; }
    });
  </script>
</body>
</html>
